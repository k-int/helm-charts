apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: service-discoverer
  labels:
    {{- include "ki-selfhost-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets", "pods"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete" ]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete" ]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["k-int.com"]
    resources: 
      - "ki-self-hosted-operators"
      - "ki-self-hosted-operators/status"
      - "ki-self-hosted-operators/finalizers"
      - "ki-self-hosted-tenants"
      - "ki-self-hosted-tenants/status"
      - "ki-self-hosted-tenants/finalizers"
      - "ki-self-hosted-channels"
      - "ki-self-hosted-channels/status"
      - "ki-self-hosted-channels/finalizers"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
