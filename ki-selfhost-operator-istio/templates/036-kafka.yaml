# See https://strimzi.io/blog/2018/11/01/using-helm/
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kisho-kafka
  annotations:
    strimzi.io/kraft: "enabled"
    strimzi.io/node-pools: "enabled"
spec:
  kafka:
    # Match a version supported by your installed Strimzi; latest doc set shows 0.47.x operator series.
    # If unsure, omit and let Strimzi choose a default compatible version, or set explicitly.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
				# Comment out these to run kafka in the clear
        # authentication:
        #   type: scram-sha-512
    # authorization:
    #   type: simple
    config:
      # Sensible replication defaults for a 3-node cluster
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
