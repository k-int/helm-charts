apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: kishoes
spec:
  version: 8.15.0
  nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: true
      # per https://www.elastic.co/guide/en/elasticsearch/reference/current/anonymous-access.html
      # and https://www.elastic.co/guide/en/elasticsearch/reference/current/built-in-roles.html
      xpack:
        security:
          authc:
            anonymous:
              username: anonymous_user
              roles: viewer
              authz_exception: true
    # https://www.elastic.co/guide/en/cloud-on-k8s/master/k8s-managing-compute-resources.html
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          # env:
          # - name: ES_JAVA_OPTS
          #   value: -Xms2g -Xmx2g
          resources:
            requests:
              memory: 24Gi
              cpu: 6
            limits:
              memory: 32Gi
              # cpu: 6
  # per https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-tls-certificates.html#k8s-disable-tls
  http:
    tls:
      selfSignedCertificate:
        disabled: true
