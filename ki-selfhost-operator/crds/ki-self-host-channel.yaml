# myapp-crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ki-self-hosted-channels.k-int.com
spec:
  group: k-int.com
  names:
    kind: KISelfHostChannel
    listKind: KISelfHostChannelList
    plural: ki-self-hosted-channels
    singular: ki-self-hosted-channel
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                channelId:
                  type: string
                channelName:
                  type: string
                channelUrl:
                  type: string
            status:
              type: object
              additionalProperties: true
              properties:
                phase:
                  type: string
                channelModules:
                  type: array
                  description: List of modules associated with this channel.
                  required:
                    - id
                    - moduleId
                    - moduleName
                    - moduleVersion
                    - image
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      moduleId:
                        type: string
                      moduleName:
                        type: string
                      moduleVersion:
                        type: string
                      image:
                        type: string
                      status:
                        type: string
                    additionalProperties: true
